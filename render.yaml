# Render Blueprint — creates the service, the persistent disk, and the
# environment in one step instead of clicking through the dashboard.
#
#   Render → New → Blueprint → pick this repo → Apply
#
# The only value it will ask you for is ADMIN_EMAIL. SESSION_SECRET is
# generated by Render and kept, which is the safe way round: set once at
# creation, never rotated by accident, never sitting in the repo.

services:
  - type: web
    name: chantsolutions
    runtime: node
    plan: starter          # free has no persistent disk, and the disk is the point
    region: ohio
    buildCommand: node build.js
    startCommand: node server.js
    healthCheckPath: /api/health

    # Without this the database is wiped on every deploy.
    disk:
      name: portfolio-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"          # node:sqlite is built in from 22
      - key: DB_PATH
        value: /data/portfolio.db
      - key: TRUST_PROXY
        value: "1"           # Secure cookies, HSTS, real client address
      - key: SESSION_SECRET
        generateValue: true  # Render mints it once and keeps it
      - key: REGISTER_MAX_PER_HOUR
        value: "10"
      - key: ADMIN_EMAIL
        sync: false          # Render prompts you for this on Apply
